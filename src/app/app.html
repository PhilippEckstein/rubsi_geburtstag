<a class="skip-link" href="#page-content" (click)="$event.preventDefault(); focusContent.focus()">Zum Inhalt</a>
<aside class="sidenav" aria-label="Seitennavigation">
  <div class="nav-heading">
    <a class="wordmark" routerLink="/geburtstag" (click)="closeMenu(); onPageActivated()">Für Rubsi<span aria-hidden="true">✳</span></a>
    <button class="menu-toggle" #menuToggle type="button" aria-controls="page-navigation" [attr.aria-expanded]="menuOpen()" (click)="toggleMenu()">{{ menuOpen() ? 'Schließen ✕' : 'Menü ☰' }}</button>
  </div>
  <nav id="page-navigation" aria-label="Seiten" [class.mobile-open]="menuOpen()" (keydown.escape)="closeMenu(); menuToggle.focus()">
    <p class="nav-caption">Deine Geburtstagsseite</p>
    <a routerLink="/geburtstag" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeMenu(); onPageActivated()"><span aria-hidden="true">✳</span> Geburtstag</a>
    @if (gift.unlocked()) {
      <a routerLink="/geschenk" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeMenu(); onPageActivated()"><span aria-hidden="true">♡</span> Dein Geschenk</a>
    }
  </nav>
  <p class="nav-note">Ein kleines Stück<br>Geburtstagsglück für dich.</p>
</aside>
<div class="page-shell">
  <main id="page-content" #pageContent #focusContent tabindex="-1">
    <router-outlet (activate)="onPageActivated()" />
  </main>
  <footer><span>Mit Liebe gemacht. Für Rubsi.</span><a routerLink="/geburtstag">Zur Geburtstagsseite ↗</a></footer>
</div>
